name: Build Fantacalcio Battitore

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: windows-x64
            os: windows-latest
            artifact: FantacalcioBattitore-windows-x64.zip

          - name: linux-x64
            os: ubuntu-latest
            artifact: FantacalcioBattitore-linux-x64.tar.gz

          - name: macos-arm64
            os: macos-15
            artifact: FantacalcioBattitore-macos-arm64.zip

          - name: macos-x64
            os: macos-15-intel
            artifact: FantacalcioBattitore-macos-x64.zip

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Environment
        shell: bash
        run: |
          java -version
          mvn -version

      # ----------------------------
      # MAVEN BUILD
      # ----------------------------

      - name: Build
        shell: bash
        run: |
          mvn --batch-mode clean package

      # ----------------------------
      # JPACKAGE INPUT
      # ----------------------------

      - name: Prepare jpackage input
        shell: bash
        run: |
          rm -rf target/package-input
          mkdir -p target/package-input

          mvn --batch-mode dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory=target/package-input

          cp target/FantacalcioBattitore-*.jar \
             target/package-input/

          echo
          echo "===== JPACKAGE INPUT ====="

          ls -lah target/package-input

      # ----------------------------
      # VERIFY JAVAFX
      # ----------------------------

      - name: Verify JavaFX dependencies
        shell: bash
        run: |
          echo "Checking JavaFX..."

          find target/package-input \
            -maxdepth 1 \
            -iname "javafx-*.jar" \
            -print

          COUNT=$(find target/package-input \
            -maxdepth 1 \
            -iname "javafx-*.jar" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: JavaFX dependencies missing!"
            exit 1
          fi

      # ----------------------------
      # FIND MAIN JAR
      # ----------------------------

      - name: Find main jar
        id: jar
        shell: bash
        run: |
          MAIN_JAR=$(find target/package-input \
            -maxdepth 1 \
            -name "FantacalcioBattitore-*.jar" \
            | head -1)

          if [ -z "$MAIN_JAR" ]; then
            echo "Main JAR not found!"
            exit 1
          fi

          MAIN_JAR=$(basename "$MAIN_JAR")

          echo "mainjar=$MAIN_JAR" >> "$GITHUB_OUTPUT"

          echo "Main JAR: $MAIN_JAR"

      # ----------------------------
      # VERIFY LAUNCHER
      # ----------------------------

      - name: Verify Launcher
        shell: bash
        run: |
          jar tf \
            "target/package-input/${{ steps.jar.outputs.mainjar }}" \
            | grep \
            "it/fantacalcio/battitore/Launcher.class"

      # ----------------------------
      # JPACKAGE
      # ----------------------------

      - name: Create application image - Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p target/dist

          jpackage \
            --type app-image \
            --name FantacalcioBattitore \
            --input target/package-input \
            --main-jar "${{ steps.jar.outputs.mainjar }}" \
            --main-class it.fantacalcio.battitore.Launcher \
            --dest target/dist \
            --app-version 1.0.0 \
            --win-console \
            --verbose

      - name: Create application image - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p target/dist

          jpackage \
            --type app-image \
            --name FantacalcioBattitore \
            --input target/package-input \
            --main-jar "${{ steps.jar.outputs.mainjar }}" \
            --main-class it.fantacalcio.battitore.Launcher \
            --dest target/dist \
            --app-version 1.0.0 \
            --verbose

      # ----------------------------
      # SHOW PACKAGE
      # ----------------------------

      - name: Show generated package
        shell: bash
        run: |
          find target/dist -maxdepth 3 -type f | head -100

      # ----------------------------
      # WINDOWS SMOKE TEST
      # ----------------------------

      - name: Test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target\dist\FantacalcioBattitore\FantacalcioBattitore.exe"

          if (-not (Test-Path $exe)) {
              throw "Executable not found: $exe"
          }

          Write-Host "Testing $exe"

          $process = Start-Process `
              -FilePath $exe `
              -PassThru

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
              if ($process.ExitCode -ne 0) {
                  throw "Application exited with code $($process.ExitCode)"
              }
          }
          else {
              Write-Host "Application started successfully."
              Stop-Process -Id $process.Id -Force
          }

      # ----------------------------
      # WINDOWS ZIP
      # ----------------------------

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/dist/FantacalcioBattitore" `
            -DestinationPath "target/${{ matrix.artifact }}"

      # ----------------------------
      # LINUX
      # ----------------------------

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd target/dist

          tar -czf \
            "../${{ matrix.artifact }}" \
            FantacalcioBattitore

      # ----------------------------
      # MAC
      # ----------------------------

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/dist

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            FantacalcioBattitore.app \
            "../${{ matrix.artifact }}"

      # ----------------------------
      # UPLOAD
      # ----------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.artifact }}